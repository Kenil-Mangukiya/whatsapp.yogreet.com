name: Deploy Node.js Backend to Server

on:
  push:
    branches:
      - main  # This triggers the workflow when you push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest  # This sets the environment to Ubuntu for the runner

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2  # This step checks out the code from your GitHub repository

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3  # This sets up the SSH key for authentication
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}  # This uses the private key stored in GitHub Secrets

    - name: Deploy to Server
      run: |
        # This command copies your code to the server
        scp -r * root@143.244.157.117:/var/www/whatsapp.yogreet.com/  # This deploys the code
      env:
        SERVER_USER: root
        SERVER_IP: 143.244.157.117

    - name: Restart Backend Server
      run: |
        # This SSH command restarts the Node.js app using PM2
        ssh -o StrictHostKeyChecking=no root@143.244.157.117 "cd /var/www/whatsapp.yogreet.com && pm2 restart whatsapp"
      env:
        SERVER_USER: root
        SERVER_IP: 143.244.157.117
